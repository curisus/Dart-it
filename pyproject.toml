[project]
name = "dart-crawler"
version = "0.1.0"
description = "DART financial report collector and stdio MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7.1",
    "httpx2[http2,brotli,zstd]>=0.1.0",
    "lxml>=5.3",
    "mcp==2.0.0",
    "openpyxl==3.1.5",
    "pydantic==2.13.4",
    "pydantic-settings>=2.7",
]

[project.scripts]
dart-crawler-mcp = "dart_crawler.mcp_server:main"

[dependency-groups]
dev = [
    "basedpyright>=1.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-openpyxl>=3.1",
    "types-defusedxml>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.vercel]
entrypoint = "api.mcp:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dart_crawler"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D",
    "D203",
    "D213",
    "CPY001",
    "E501",
    "FBT001",
    "FBT002",
    "FIX002",
    "ICN001",
    "PLC0415",
    "PLR",
    "PTH",
    "PYI034",
    "S314",
    "TC",
    "TD002",
    "TD003",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
# Vercel deploys every file under api/ as its own function, so the directory
# must stay a plain folder: an __init__.py would be deployed as a function too.
"api/*.py" = ["INP001"]
# Standalone validation entry points, run by hand rather than imported: their
# product is the evidence they print, so stdout is the output channel.
"scripts/**/*.py" = ["INP001", "T201"]
# The fitness harness is promoted evidence tooling: its judgements must stay
# byte-identical to the run that produced the campaign report, so it is kept as
# written rather than restructured to satisfy style rules. It reads arbitrary
# JSON envelopes (ANN401), dispatches through one uniform lambda table whose
# unused first argument keeps the signatures identical (ARG005), and narrows
# with assert (S101).
"scripts/fitness/*.py" = [
    "ANN401",
    "ARG005",
    "C901",
    "EM102",
    "PERF401",
    "RUF046",
    "S101",
    "SIM113",
    "TRY003",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["live: uses the configured OpenDART API and network access"]
filterwarnings = ["error"]
